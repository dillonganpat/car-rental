name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-rental/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: car-rental/server/package-lock.json
      - run: npm ci
      - run: npm test

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-rental/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: car-rental/client/package-lock.json
      - run: npm ci
      - run: npm run build
